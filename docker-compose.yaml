services:
  app:
    build: ./app
    networks: [proxy-net]

  nginx1:
    image: nginx:alpine
    ports: ["8001:80"]
    volumes:
      #- ./nginx/conf.d/00-maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ./nginx/nginx1.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, nginx2, nginx3]
    networks: [proxy-net]

  nginx2:
    image: nginx:alpine
    ports: ["8002:80"]
    volumes:
      #- ./nginx/conf.d/00-maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ./nginx/nginx2.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy-net]

  nginx3:
    image: nginx:alpine
    ports: ["8003:80"]
    volumes:
      #- ./nginx/conf.d/00-maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ./nginx/nginx3.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy-net]

networks:
  proxy-net:
    driver: bridge