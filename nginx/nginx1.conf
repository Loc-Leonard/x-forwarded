upstream app { server app:80; }
upstream nginx2 { server nginx2:80; }
upstream nginx3 { server nginx3:80; }

server {
    listen 80;

    location / {
        # Входной прокси: игнорируем любой X-Forwarded-For от пользователя
        # Начинаем цепочку с реального IP клиента
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://app;
    }

    location /via2/ {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://nginx2/;
    }

    location /via3/ {
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://nginx3/;
    }
}