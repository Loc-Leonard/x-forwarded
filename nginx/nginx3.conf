upstream app { server app:80; }

server {
    listen 80;

    location / {
        # Внутренний прокси: доверяем входящему X-Forwarded-For и добавляем свой IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://app;
    }
}